# Book configuration
# https://jupyterbook.org/customize/config.html

title: "arXiv Knowledge Discovery & Entity Resolution"
author: "HCMUS Data Science Project — Group 04"
copyright: "2026"
logo: ""

# Execution settings
execute:
  execute_notebooks: "auto"    # Run un-executed notebooks at build time to dynamically generate figures/tables
  timeout: 300                 # Max seconds per cell execution
  allow_errors: false          # Stop build on execution error for high quality assurance
  stderr_output: "show"

# HTML-specific settings
html:
  favicon: ""
  use_issues_button: true
  use_repository_button: true
  home_page_in_navbar: true
  extra_navbar: |
    <p>HCMUS Intro to Data Science</p>
    <p>Project Milestones Report</p>
  extra_css:
    - _static/custom.css

# Repository settings
repository:
  url: "https://github.com/Dangkhanh01/arXiv-report"
  path_to_book: "book"
  branch: "main"

# Sphinx configuration extensions
sphinx:
  extra_extensions:
    - sphinx.ext.autodoc
    - sphinx.ext.mathjax
    - sphinxcontrib.mermaid
  config:
    html_static_path: ["_static"]
    html_css_files:
      - custom.css
    myst_update_mathjax: false
    mathjax3_config:
      tex:
        inlineMath:
          - ["\\(", "\\)"]
          - ["$", "$"]
        processEscapes: true
      options:
        processHtmlClass: "tex2jax_process|mathjax_process|math|output_area|cell_output|output|text_html"
    exclude_patterns:
      - "_build"
      - "_build/*"
      - "content/milestone2/*"
      - "content/milestone3/*"
    html_theme_options:
      repository_url: "https://github.com/Dangkhanh01/arXiv-report"
      use_repository_button: true
      use_download_button: true
      use_fullscreen_button: true

